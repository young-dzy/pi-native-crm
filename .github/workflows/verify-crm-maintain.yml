# CI paused 2026-10-25 (Actions minutes exhausted). Restore the original triggers to re-enable.
# Manutenção diária do verify-crm.
#
# O schedule do Actions só dispara na branch default, e o fork de quem
# clonou herdaria o cron. O `if` abaixo limita o job a helsome/AiNativeCrm
# (ou a um workflow_dispatch manual). Sem os três secrets o job para antes
# do `supabase start` e sai blocked — não há passe ao vivo, então não há
# `clean`.
#
# Sem GitHub Environment (required reviewers não está disponível neste
# repositório privado sem GitHub Pro). Secrets do repositório ganham de
# .cursor/skills/verify-crm/opencode.env. O arquivo só entra quando o
# secret está vazio. A chave fica no histórico do git para sempre;
# apagar o arquivo não revoga. O dono revoga no OpenCode depois da prova.
#   OPENCODE_API_KEY    a chave do OpenCode; nunca impressa
#   OPENCODE_BASE_URL   https://opencode.ai/zen/go/v1 para esta chave
#   OPENCODE_MODEL      cat-jam-free
#
# O cron não faz a source wave e não abre o PR de outcome changed.
# A source wave é um subagente read-only do Cursor por feature file. O
# Actions não tem esse runtime. Abrir o PR pediria permissão de escrita
# no conteúdo e nos pull requests, mais um commit. Um schedule com esses
# escopos commitaria a árvore sem o julgamento da source wave e sem
# alguém reler o diff. O bloco permissions abaixo fica só em leitura.
# Quem segue
# .cursor/skills/maintain-verify-crm/SKILL.md faz a wave e, se o desfecho
# for changed, abre aquele único PR.
#
# O job mede: segredos, launch, doctor, drive, observe-unreachable, fechar.
name: verify-crm-maintain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-crm-maintain
  cancel-in-progress: false

jobs:
  manter:
    if: github.repository == 'helsome/AiNativeCrm' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERIFY_CRM_EVIDENCE_ROOT: /tmp/verify-crm-evidence
      VERIFY_CRM_ARTIFACT_ROOT: /tmp/verify-crm-artifacts
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Carregar credenciais OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          VERIFY_CRM_MODEL_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OPENCODE_E2E_MODEL_ID: ${{ secrets.OPENCODE_MODEL }}
        run: bash scripts/verify-crm/carregar-opencode-env.sh

      - name: Exigir os três segredos
        id: segredos
        run: pnpm exec tsx scripts/verify-crm/maintain.ts --exigir-segredos

      - name: Preparar dependência Playwright do harness
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const testRoot = path.dirname(require.resolve("@playwright/test/package.json"));
          const installed = path.dirname(require.resolve("playwright/package.json", { paths: [testRoot] }));
          const target = path.resolve("node_modules/playwright");
          if (!fs.existsSync(target)) fs.symlinkSync(installed, target, "dir");
          require("playwright");
          NODE

      - name: Subir a instância
        id: launch
        run: .cursor/skills/verify-crm/scripts/control-crm launch

      - name: Doctor antes da chave
        if: steps.launch.outcome == 'success'
        continue-on-error: true
        run: .cursor/skills/verify-crm/scripts/control-crm doctor

      - name: Dirigir workbench-run
        id: drive
        if: steps.launch.outcome == 'success'
        run: |
          set +e
          .cursor/skills/verify-crm/scripts/control-crm drive workbench-run
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abrir cada tela inalcançável uma vez
        if: steps.launch.outcome == 'success'
        run: .cursor/skills/verify-crm/scripts/control-crm observe-unreachable

      - name: Fechar o passe
        if: always() && steps.segredos.outcome == 'success'
        env:
          VERIFY_DRIVE_EXIT: ${{ steps.drive.outputs.code }}
        run: pnpm exec tsx scripts/verify-crm/maintain.ts --fechar --drive-exit "$VERIFY_DRIVE_EXIT"

      - name: Limpar a instância
        if: always() && (steps.launch.outcome == 'success' || steps.launch.outcome == 'failure')
        run: .cursor/skills/verify-crm/scripts/control-crm cleanup || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-crm-maintain-${{ github.run_id }}
          path: /tmp/verify-crm-evidence
          retention-days: 7
          if-no-files-found: ignore
